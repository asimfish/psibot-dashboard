<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PsiBot 研钵取放小样</title><style>body{max-width:1100px;margin:auto;padding:24px;font:16px/1.55 system-ui;color:#19282b}article{border-top:1px solid #bbb}article div{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0 0 14px;flex:1 1 240px}video{width:100%;aspect-ratio:4/3}a{color:#125955}</style><main><a href="dataset.html#technical-current">返回验收台账</a><h1>PsiBot 研钵取放小样</h1><p>抓取前的手腕轨迹抬高 8 mm 后，两个独立初始条件均完成取放，终点误差在 20 mm 内，全程未报告超过 1 N 的非预期接触。手与研钵接触力作标注。两条小样供核对动作与视角，100 条主集另行验收。</p><article><h2>初始条件 1</h2><p>终点残差 7.24 mm · 手与研钵峰值 53.16 N</p><div><figure><figcaption>头部</figcaption><video controls playsinline preload='none' src='assets/dataset-pp-mortar-pilot-nov20/episode-1-head.mp4'></video></figure><figure><figcaption>胸部</figcaption><video controls playsinline preload='none' src='assets/dataset-pp-mortar-pilot-nov20/episode-1-chest.mp4'></video></figure><figure><figcaption>第三视角</figcaption><video controls playsinline preload='none' src='assets/dataset-pp-mortar-pilot-nov20/episode-1-third.mp4'></video></figure></div></article><article><h2>初始条件 2</h2><p>终点残差 8.12 mm · 手与研钵峰值 55.19 N</p><div><figure><figcaption>头部</figcaption><video controls playsinline preload='none' src='assets/dataset-pp-mortar-pilot-nov20/episode-2-head.mp4'></video></figure><figure><figcaption>胸部</figcaption><video controls playsinline preload='none' src='assets/dataset-pp-mortar-pilot-nov20/episode-2-chest.mp4'></video></figure><figure><figcaption>第三视角</figcaption><video controls playsinline preload='none' src='assets/dataset-pp-mortar-pilot-nov20/episode-2-third.mp4'></video></figure></div></article></main></html>
