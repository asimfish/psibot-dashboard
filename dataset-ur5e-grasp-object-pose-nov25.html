<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UR5e 100 mL 烧杯抓取单例</title><style>body{font:17px/1.65 system-ui,sans-serif;color:#203237;max-width:1100px;margin:1em auto;padding:0 1em}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #bccccc;padding:.4em;text-align:left}img{max-width:100%}a{color:#075985}h2{margin-top:2em}small{display:block}</style><main><p><a href="dataset.html#technical-current">返回数据集台账</a></p><h1>UR5e 100 mL 烧杯抓取单例</h1><p>这是采用运动学实验台后，按复位时烧杯的实测位姿重新计算抓取路径的一条原生试采。实际抬升 115.48 mm，终点误差 4.54 mm，手与杯力峰 10.83 N。记录段超过 1 N 的非预期接触有 0 组。原生任务成功，数值和固定物门槛通过。量产待复核。</p><p>开录和末帧核对了桌体和机械臂底座。底座相对名义安装位置的最大平移为 0.00019 mm。图中从左到右为头部、胸部和第三视角。</p><figure><a href="assets/ur5e-grasp-object-pose-nov25/start.jpg"><img src="assets/ur5e-grasp-object-pose-nov25/start.jpg" alt="开录的三个同期视角" width="1000"></a><figcaption>开录，物理步 56</figcaption></figure><figure><a href="assets/ur5e-grasp-object-pose-nov25/end.jpg"><img src="assets/ur5e-grasp-object-pose-nov25/end.jpg" alt="末帧的三个同期视角" width="1000"></a><figcaption>末帧，物理步 1388</figcaption></figure></main></html>
