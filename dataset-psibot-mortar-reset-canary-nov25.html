<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PsiBot 研钵取放 · 复位单例</title><style>body{font:18px/1.6 system-ui,sans-serif;color:#17282c;background:#fafbf9;margin:auto;max-width:1200px;padding:24px}h1,h2{line-height:1.25}img{width:100%;height:auto}figure{margin:0}figcaption{color:#405458}a{color:#186052}</style><main><a href="dataset-psibot-support-calibration-nov25.html">返回支撑面复核</a><h1>PsiBot 研钵取放 · 复位单例</h1><p><strong>单例数值检查通过，待画面复核</strong>。本例在物理稳定阶段之前写入采集源位姿。原研钵取放主集保持撤回。</p><p>开录时底面与实测桌面的间隙 0.591 mm，静态参考 0.587 mm。首个控制间隔上移 -0.001 mm，原数据为 4.88–4.92 mm。终点误差 8.30 mm，三路画面各 614 帧，30 Hz。</p><section id="start"><h2>开录帧</h2><figure><a href="assets/psibot-mortar-reset-nov25/mortar-start.jpg"><img src="assets/psibot-mortar-reset-nov25/mortar-start.jpg" width="1920" height="480" alt="开录帧同一物理时刻头部、胸部和侧面原始画面"></a><figcaption>从左到右为头部、胸部、第三视角。点击查看原尺寸。</figcaption></figure></section><section id="end"><h2>末帧</h2><figure><a href="assets/psibot-mortar-reset-nov25/mortar-end.jpg"><img src="assets/psibot-mortar-reset-nov25/mortar-end.jpg" width="1920" height="480" alt="末帧同一物理时刻头部、胸部和侧面原始画面"></a><figcaption>从左到右为头部、胸部、第三视角。点击查看原尺寸。</figcaption></figure></section><p>策略评测保留既有复位；其首拍约 4.9 mm 上移已列入数据卡。</p></main></html>
